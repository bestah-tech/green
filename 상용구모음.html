<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>상표심사 상용구 모음</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { background:#EDF0F4; }
body {
  font-family:'Malgun Gothic',AppleGothic,sans-serif;
  color:#1C2733; font-size:13px; line-height:1.65;
}
/* ── 좌측 사이드바 (특허넷 문구삽입 패널 스타일) ── */
#side {
  position:fixed; left:0; top:0; bottom:0; width:230px;
  background:#FFFFFF; border-right:2px solid #17324D; overflow-y:auto;
  padding:0 0 30px 0;
}
#side h1 {
  font-size:15px; background:#17324D; color:#fff; padding:10px 12px;
  letter-spacing:-0.5px;
}
#side h1 .v { background:#D89B2B; color:#fff; font-size:11px; padding:0 6px; border-radius:3px; margin-left:6px; }
.tabs { padding:8px; border-bottom:1px solid #E1E7EE; }
.tabbtn {
  display:block; width:100%; text-align:left; cursor:pointer;
  font-family:inherit; font-size:13px; font-weight:bold;
  border:1px solid #17324D; background:#fff; color:#17324D;
  padding:7px 10px; margin-bottom:4px;
}
.tabbtn.on { background:#17324D; color:#fff; }
.cats { padding:6px 0; }
.cat {
  display:block; padding:6px 12px 6px 18px; cursor:pointer; color:#33445A;
  border-left:4px solid transparent;
}
.cat:hover { background:#F2F6FB; }
.cat.on { border-left-color:#D89B2B; background:#FEFAF1; color:#17324D; font-weight:bold; }
.cat .n { color:#8A96A3; font-size:11px; }
.sideinfo { padding:10px 12px; color:#8A96A3; font-size:11px; border-top:1px solid #E1E7EE; margin-top:8px; }

/* ── 우측 본문 ── */
#main { margin-left:230px; padding:16px 20px 80px 20px; max-width:1000px; }
.topbar { border-bottom:3px solid #17324D; padding-bottom:10px; margin-bottom:12px; }
.topbar h2 { font-size:17px; color:#17324D; display:inline; }
.topbar .sub { color:#6B7A8C; font-size:12px; margin-left:10px; }
#q {
  width:100%; border:1px solid #B7C2CE; padding:8px 10px; font-size:13px;
  font-family:inherit; background:#FBFCFD; margin-bottom:14px;
}
.cathead {
  font-size:14px; font-weight:bold; color:#17324D; background:#E7ECF2;
  padding:7px 12px; margin:18px 0 8px 0; border-left:5px solid #17324D;
}
.card {
  background:#fff; border:1px solid #C9D2DC; margin-bottom:10px; cursor:pointer;
  position:relative;
}
.card:hover { border-color:#17324D; }
.card .t {
  font-weight:bold; color:#17324D; padding:7px 12px; background:#F5F8FB;
  border-bottom:1px solid #E1E7EE; font-size:13px;
}
.card .t .tag {
  font-weight:normal; font-size:11px; color:#fff; background:#8A96A3;
  padding:0 6px; border-radius:3px; margin-right:6px;
}
.card pre {
  font-family:inherit; white-space:pre-wrap; word-break:break-all;
  padding:10px 14px; font-size:12.5px; color:#2A3644; max-height:340px; overflow-y:auto;
}
.card .cp {
  position:absolute; right:8px; top:6px; font-size:11px; color:#8A96A3;
}
.card.copied { border-color:#1E6E3C; }
.card.copied .cp { color:#1E6E3C; font-weight:bold; }
.hint { color:#8A96A3; font-size:12px; margin-bottom:10px; }
.noresult { color:#8A96A3; padding:30px 0; text-align:center; }
</style>
</head>

@@ 점검표 | 표장분석·관념 | 관념 분석 기재 예 — 조어 + 사전 뜻 나열
ㅇ 올드파인 : 사전상 관념이 없는 조어

파인 : 1 巴人 : 명사 '촌사람'을 낮잡아 이르는 말.
fine : 1.형용사 질 높은, 좋은  2.형용사 건강한  3.부사 잘, 괜찮게

  - Peace : 1. 평화 2. 평온(함), 평화로움 3. 화평, 화목
  - Piece : 1. 조각, 단편. 2. (한 벌인 물건 중의) 일부, 부분, 부분품 3. (하나로 뭉뚱그려진 물건의) 일부(분), 한 구획; 약간의〔작은〕물건
  - in : prep. 1. ⦗장소⦘⦗위치⦘ …의 속에〔의〕; …속〔안〕에서 2. ⦗상태⦘ …한 상태로〔에〕

- 두 단어가 결합되어 실체적 관념 형성하는 경우 ex) 슈퍼스타 정도는 되어야 새로운 관념형성으로 본다.
@@ 점검표 | 표장분석·관념 | 관념 분석 기재 예 — 한자 분석 포함
ㅇ 소주물 : 사전적 관념 없음
*소
 1. 솟과의 포유류
 2. 고기나 생선 따위를 쓰지 아니하고 채소류만으로 만든 음식.
 3. 원고가 법원에 대하여 특정한 소송물의 정당성 여부를 심판하여 권리 보호를 허락하여 달라고 요구하는 신청.
 4. (所) 고려ㆍ조선 초기에, 천민들이 집단으로 모여 살며 광물이나 수공품의 생산을 맡아 하던 특수 행정 구역.
*주물
 1. 쇠붙이를 녹여 거푸집에 부은 다음, 굳혀서 만든 물건.
 2. 원시 종교에서, 악귀를 물리치고 행운을 가져다주는 신비한 힘을 가졌다고 하여 신성시하는 물건.

所 : 바 소 / 廚 : 부엌 주 / 物 : 만물 물
* 한자 "所廚物"로 '서원이나 향교 같은 전통 건축에서 음식을 만들거나 제사 음식을 준비하는 공간'으로 관념된다고 하여도 사용례가 거의 없고 내용이 추상적으로 암시 강조 정도의 표장으로 판단함.
@@ 점검표 | 식별력 판단 | 식별력 인정 — 조어·다양한 의미
이 출원표장 "○○"는 사전상 관념없는 조어 혹은 "…, …" 등 다양한 의미가 있는 표장으로 지정상품과 관련하여 성질표시로 직감되지 않으며, 거래사회에 흔히 사용하는 표장이거나 기타 독점권을 허용하지 말아야 할 합리적 이유도 없으므로 식별력 있는 표장으로 판단됨.
@@ 점검표 | 식별력 판단 | 식별력 인정 — 암시·강조 표장
이 출원표장 "당뇨야놀자"는 '즐겁게 당뇨를 극복하자' 정도로 관념될 수 있는 표장으로, 이는 지정상품과 관련하여 직접적이라기 보다는 암시·강조하는 것이며 거래사회에서 흔히 사용하는 표장이거나 기타 독점권을 허용하지 말아야 할 합리적 이유도 없으므로 식별력을 인정함.
@@ 점검표 | 식별력 판단 | 도형 식별력 불인정
ㅇ 도형 : 식별력 불인정.
붓으로 그린 듯이 한줄로 이어지며 문자가 도안화 되어있고 한자 '燮'이 인장의 형태로 되어있지만, 이는 전체적인 표장에서 작은 비중을 차지하여 부기적 부분으로 볼 수 있고 문자의 인식력을 압도할 특별현저성이 없으므로 식별력 불인정.
@@ 점검표 | 식별력 판단 | 문자 식별력 없고 도형만 식별력 있는 경우
문자 "greens"는 사전상 '푸른 채소'의 의미가 있어 지정상품의 성질표시(원재료, 제공내용 등)으로 직감되어 식별력이 없거나 미약한 부분으로 일반수요자들에게 강한 인상을 주는 요부로 보기 어려워 보여 도형의 차이로 외관이 명확히 다른 선등록과는 공존하여도 오인 혼동의 우려는 적을 것으로 판단함.
@@ 점검표 | 식별력 판단 | 식별력 인정 검토의견 틀 (선심 인용)
- 33조 식별력 관련 : 출원인 의견을 반영하여 식별력 인정.
'○○'는 '…' 정도로 해석되는 조어적 표현으로 그 관념상 상품의 성질을 암시 또는 강조하는 표장 정도로 지정상품의 성질을 직접적으로 표현한 표장에 해당된다고 할 수 없으며, 거래사회에 흔히 사용하는 표장이거나 기타 독점권을 허용하지 말아야 할 합리적 이유도 없으므로 지정상품과 관련하여 식별력이 있다고 판단됨.
또한, 다수의 선심 (등록번호 ○○, ○○)에서 '○○'을 지정상품 및 서비스의 성질을 암시하는 정도로 판단하여 식별력을 인정한 것을 참고하여 본 출원상표의 식별력도 인정함.
=> 거절이유가 해소되어 출원공고 결정함.
@@ 점검표 | 식별력 판단 | 외국어 표장 식별력 인정 검토의견 틀 (①~④)
- 33조 식별력 관련 : 협력심사 결과(전부 식별력 인정) 및 출원인 의견을 반영하여 식별력 인정
출원표장 "○○"는 ○○어로 '…'의 뜻을 가진 표장으로
① ○○어는 대한민국 교육 과정상 제2외국어 범주에서도 극히 소외되어 있어 해당 상표의 의미를 일반 수요자가 직감하기 어렵고,
② 그 의미가 지정상품의 성질을 직접적으로 표시한다고 보기는 어려우며,
③ 실제로 국내 포털 사이트 및 관련 거래 업계를 조사해 보더라도, 이 사건 출원상표가 지정상품과 관련하여 다수의 동종 업체나 일반 수요자들에 의해 상품의 성질이나 품질을 표시하는 용어로 흔하게 사용되고 있다는 정황은 전혀 찾아볼 수 없다는 점
④ 동일유사군내 유사한 의미의 표장의 식별력을 인정한 선심들이 존재한다는 점
등을 고려한다면 지정상품의 성질을 보통으로 사용하는 방법으로 표시한 표장으로 단정하기 어렵고, 거래사회에서 누구라도 이를 사용할 필요가 있고 그 사용을 원한다고 볼만한 사정도 찾을 수 없어 식별력이 없다고 단정하기 어려워 식별력 인정함.
=> 거절이유가 해소되어 출원공고 결정함.
@@ 점검표 | 식별력 판단 | 도형 식별력 인정 — 도안화 정도·비중·위치 (강아지 도형 예)
- 도형 : 강아지 모양 얼굴에 잎사귀가 결합된 형상으로,
도안화의 정도, 표장에서 차지하는 비중, 위치 등을 고려해 볼 때, 수요자의 주의를 끌기에 충분한 도형이고, 지정상품과 관련하여 흔히 사용하는 표장도 아니며 현저성 있으므로 자체 식별력 인정
@@ 점검표 | 식별력 판단 | 도형 식별력 인정 — 문자 강조 도형 (MOS 예)
도형부는, 영문자 'MOS'를 강조하는 모양의 사각형과 도안화된 나뭇잎 모양을 형상화 한 것으로 도안화의 정도, 위치, 표장에서 차지하는 비중 등을 고려해 볼 때, 간단하고 흔히 있는 표시도 아니고 또한 보통으로 사용하는 방법으로 사용하는 표장도 아닌 등 수요자의 주의를 끌만한 충분한 도형으로 식별력이 인정됨
@@ 점검표 | 식별력 판단 | 식별력 인정 — 각 부분은 약하나 전체로 인정 (Peace In Piece 예)
출원상표 "Peace In Piece"는 '평화'의 의미가 있는 "Peace"와 '~안에' 등의 뜻이 있는 영어전치사 "In", 그리고 '조각, 단편' 등의 의미가 있는 "Piece"이 차례로 결합된 표장으로, 각각은 다수 공존하거나 간단하고 흔한 표장에 해당하여 식별력이 없거나 약하지만, 전체로는 '조각난 평화' 정도의 의미로 인식되지만, 지정상품과 관련하여 직접적인 연관성(품질,효능,용도 등)을 찾을 수 없으며 또한 거래계에서 다수가 사용하거나 공익을 해할 우려가 있는 표장도 아니므로 식별력이 있음

▣ 관찰방법 : 전체관찰
@@ 점검표 | 식별력 판단 | 식별력 인정 — 조어 원문 예 (올드파인·로델로·커들라우드)

[참고판례 2023원1385] - "오우도" VS "오우돈", "오우드" => 호칭비유사.
이 사건 출원상표와 선등록상표 1, 2의 호칭을 대비해 보면, 앞의 두 음절과 마지막 음절의 초성이 각각 '오우'와 'ㄷ'로 동일하고 마지막 음절의 중성이 'ㅗ'와 'ㅡ'로 다르거나 종성에 'ㄴ'의 유무 차이만 있어 일응 유사하게 청감되는 측면이 있다. 그러나 이 사건 출원상표의 마지막 음절인 '도'는 혀를 입 중간에 두고 입술 모양을 둥글게 하여 발음이 되며 소리가 혀나 입술에 의해 닫히거나 막힘이 없이 나오는 반면에, 선등록상표 1의 '돈'은 자음 'ㄴ' 받침으로 인해 혀를 윗잇몸에 붙여 발음이 되고 소리가 혀에 의해 막히면서 나오며, 선등록상표 2의 '드'는 혀를 높여 입의 뒤쪽에 위치해 두고 입을 좌우로 길게 벌려 발음이 되며 소리가 좌우로 길고 좁게 벌어진 입술 사이로 나오게 되므로 일반 수요자들도 그 발음의 차이를 충분히 구별할 수 있을 것으로 보이고, 통상 3음절의 짧은 한글로 구성된 표장은 미세한 발음의 차이도 어렵지 않게 구별할 수 있을 것으로 보이므로 양 표장의 호칭은 명확히 구별될 수 있다고 판단된다.

최근 영어보급 수준이 높아짐에 따라 일반 수요자들이 'p'와 'f'를 충분히 구별할 수 있을 것으로 보이므로 두 상표를 오인혼동할 가능성이 낮다고 판단됨.

선등록상표는 '피그'로 호칭될 것인데, 이 사건 출원상표가 '피그' 호칭되는 경우 선등록상표와 그 발음이 유사한 점은 있다. 다만, 최근 국내 소비자들의 영어 활용 능력에 비추어 보면 같은 한글의 'ㅍ' 발음이라 하더라도 영문자의 'f'와 'p' 발음의 차이를 구분하는 경향이 있는 점을 고려하면 양 상표의 전체 발음 차이를 어느 정도는 구분할 수 있을 것으로 보인다.

상표등록출원 제40-20○○-○○호의 출원인은 아래와 같이 지정상품(서비스업) '□□'의 생산, 양도, 판매 등의 사업계획을 가지고 있고, ○○년 ○○월경부터 상표사용을 시작할 계획입니다.
- 사용 계획 -
 1. ○○년 ○○월 ○○일 신규사업프로젝트 시작
 2. ○○년 ○○월 ○○일 사업허가 신청
 3. ○○년 ○○월 ○○일 점포임대
   o 점포임대에 관한 구체적인 내용(위치, 설비 등)
 4. ○○년 ○○월 ○○일 판매개시 예정
   o 판매방법, 시기 등에 관한 구체적인 내용
첨부 : 관련증거서류
* 사용사실을 증명하는 관련증거서류는 신문ㆍ잡지ㆍ카달로그, 매장 또는 상품사진, 납품서, 청구서 등 거래관련서류, 국가 또는 공공단체 등의 사용사실 증명서, 사업자등록증, 상호등기부 등본 등 첨부 필요. 끝.

○ (판단근거) 외국어로 된 표장은 원칙적으로 일반 수요자나 거래자가 직관적으로 그 의미를 인식할 수 있는 경우이어야 하나, 그 단어가 갖고 있는 객관적인 의미가 상품의 품질ㆍ효능ㆍ용도 등을 나타내는 것이고, 실제 그와 같은 의미대로 상품의 품질ㆍ효능ㆍ용도 등으로 사용되고 있다면, 비록 그 단어 자체는 일반 수요자들이 쉽게 접할 수 없어 사전 등을 찾아보고서야 알 수 있는 것으로 보이더라도 이러한 표장은 성질표시표장에 해당한다고 보아야 할 것이다 (대법원 2003. 5. 13. 선고 2002후192 판결, 대법원 1989. 8. 8. 선고 89후513 판결, 대법원 1984. 5. 9. 선고 83후22 판결, 특허법원 2016. 9. 23. 선고 2016허1772 판결 등).
○ (심사내용) 출원인은 출원상표 "○○"이 대중에게 널리 알려지지 않은 생소하고 전문적인 외국어 명칭이어서, 일반 수요자가 사전을 찾아보지 않고서는 즉각적으로 그 뜻을 떠올릴 수 없으므로 조어처럼 인식되어 식별력이 충분하다고 주장하십니다. 그러나 대법원 판례에 따르면 외국어 표장이 사전을 찾아보고서야 비로소 그 뜻을 알 수 있는 단어라 하더라도, 그 단어의 객관적인 의미가 지정상품(서비스업)의 원재료나 성질을 나타낸다면 성질표시에 해당한다고 볼 수 있습니다. 따라서 출원상표를 지정서비스업에 사용할 경우, 일반 수요자나 관련 거래자들은 '…'으로 그 서비스의 제공 내용 및 성질을 직접적으로 직감하게 됩니다. 결과적으로 본 출원상표는 특정인에게 독점시킬 수 없는 성질표시에 해당하여 상표법 제33조 제1항 제3호 및 제7호에 의해 등록을 받을 수 없습니다.

○ (심사내용) 출원인은 이 출원상표 "○○"가 일체적 표장으로서 지정서비스업과의 관계에서 직접적·구체적인 성질표시로 직감되지 아니하고, "○○"를 포함하는 다수의 등록례가 존재하므로 식별력이 인정되어야 한다고 주장하십니다. 그러나 "○○"는 오늘날 ○○ 분야에서 …을 지칭하는 용어로 일반화되어 있고, "○○" 역시 …을 가리키는 표현으로 관련 거래업계에서 다수인이 현실적으로 널리 사용하고 있는 사실이 인터넷 검색 등을 통하여 확인됩니다. 이와 같이 거래사회에서 다수인이 일반적으로 사용하고 있는 표현은 이를 아래 지정서비스업에 사용하더라도 일반 수요자나 거래자가 특정인의 업무에 관련된 서비스업을 표시하는 것으로 인식한다고 보기 어려우므로, 이 출원상표는 해당 지정서비스업과의 관계에서 사회통념상 자타서비스업의 식별력을 인정하기 곤란한 표장에 해당합니다. 또한 위와 같이 거래업계에서 다수인이 현실적으로 사용하고 있고 앞으로도 사용할 필요가 있는 표현을 어느 한 사람에게 독점시키는 것은 공익상 적절하지 아니합니다.

      cat: head[1].replace(/^\s+|\s+$/g,''),
      title: head[2].replace(/^\s+|\s+$/g,''),
      body: p.substring(nl+1).replace(/^\n+|\s+$/g,'')
    });
  }
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function cats(tab){
  var seen = {}, out = [], i;
  for(i=0;i<DATA.length;i++){
    if(DATA[i].tab !== tab) continue;
    if(!seen[DATA[i].cat]){ seen[DATA[i].cat] = 0; out.push(DATA[i].cat); }
    seen[DATA[i].cat]++;
  }
  return { list: out, count: seen };
}
function setTab(t){
  CUR_TAB = t; CUR_CAT = '*';
  document.getElementById('tabChk').className = 'tabbtn' + (t==='\uC810\uAC80\uD45C' ? ' on' : '');
  document.getElementById('tabRej').className = 'tabbtn' + (t==='\uAC70\uC808\uC758\uD1B5' ? ' on' : '');
  document.getElementById('mainTitle').innerHTML =
    (t==='\uC810\uAC80\uD45C') ? '\uC2EC\uC0AC\uC810\uAC80\uD45C\uC6A9 \uC0C1\uC6A9\uAD6C' : '\uAC70\uC808\uACB0\uC815\uC11C \u00B7 \uC758\uACAC\uC81C\uCD9C\uD1B5\uC9C0\uC11C \uBB38\uC548 (\uAC70\uC808\uC0AC\uC720\uBCC4)';
  renderCats(); render();
}
function setCat(c){ CUR_CAT = c; renderCats(); render(); }
function renderCats(){
  var c = cats(CUR_TAB), h = '', i;
  h += '<span class="cat' + (CUR_CAT==='*' ? ' on' : '') + '" onclick="setCat(\'*\')">\u203A \uC804\uCCB4 \uBCF4\uAE30</span>';
  for(i=0;i<c.list.length;i++){
    var nm = c.list[i];
    h += '<span class="cat' + (CUR_CAT===nm ? ' on' : '') + '" onclick="setCat(\'' +
         nm.replace(/'/g,"\\'") + '\')">\u203A ' + esc(nm) +
         ' <span class="n">(' + c.count[nm] + ')</span></span>';
  }
  document.getElementById('catList').innerHTML = h;
}
function render(){
  var q = document.getElementById('q').value.replace(/^\s+|\s+$/g,'').toLowerCase();
  var h = '', lastCat = '', shown = 0, i;
  for(i=0;i<DATA.length;i++){
    var d = DATA[i];
    if(d.tab !== CUR_TAB) continue;
    if(!q && CUR_CAT !== '*' && d.cat !== CUR_CAT) continue;
    if(q){
      var hay = (d.cat + ' ' + d.title + ' ' + d.body).toLowerCase();
      if(hay.indexOf(q) < 0) continue;
    }
    if(d.cat !== lastCat){
      h += '<div class="cathead">' + esc(d.cat) + '</div>';
      lastCat = d.cat;
    }
    h += '<div class="card" onclick="copyIt(' + i + ', this)">' +
      '<div class="t"><span class="tag">' + esc(d.cat) + '</span>' + esc(d.title) + '</div>' +
      '<div class="cp">\uD074\uB9AD\uD558\uC5EC \uBCF5\uC0AC</div>' +
      '<pre>' + esc(d.body) + '</pre></div>';
    shown++;
  }
  if(!shown) h = '<div class="noresult">\uD574\uB2F9\uD558\uB294 \uC0C1\uC6A9\uAD6C\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4.</div>';
  document.getElementById('cards').innerHTML = h;
}
function copyIt(i, el){
  var t = DATA[i].body, ok = false;
  try{
    if(window.clipboardData){ window.clipboardData.setData('Text', t); ok = true; }
  }catch(e){}
  if(!ok){
    try{
      var ta = document.createElement('textarea');
      ta.value = t;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e2){}
  }
  var cards = document.getElementById('cards').getElementsByTagName('div');
  el.className = 'card' + (ok ? ' copied' : '');
  var cp = el.getElementsByTagName('div');
  for(var j=0;j<cp.length;j++){
    if(cp[j].className === 'cp')
      cp[j].innerHTML = ok ? '\u2714 \uBCF5\uC0AC\uB428 \u2014 \uD2B9\uD5C8\uB137\uC5D0 Ctrl+V' : '\uBCF5\uC0AC \uC2E4\uD328(\uC218\uB3D9 \uC120\uD0DD \uD544\uC694)';
  }
}
parseDB();
renderCats();
render();
</script>
